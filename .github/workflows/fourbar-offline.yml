name: Four-bar Offline APK

on:
  push:
    paths:
      - 'fourbar_offline/**'
      - '.github/workflows/fourbar-offline.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fourbar_offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fourbar-offline-apk
          path: fourbar_offline/app/build/outputs/apk/debug/app-debug.apk

