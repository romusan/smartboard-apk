name: SmartBoard CI

on:
  push:
    paths:
      - 'smartboard/**'
      - '.github/workflows/smartboard.yml'
  pull_request:
    paths:
      - 'smartboard/**'
      - '.github/workflows/smartboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: smartboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartboard/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle testDebugUnitTest assembleDebug
      - name: Publish latest debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p smartboard/dist
          cp smartboard/android/app/build/outputs/apk/debug/app-debug.apk smartboard/dist/app-debug-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smartboard/dist/app-debug-latest.apk
          git diff --cached --quiet || git commit -m "Update latest debug APK [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: smartboard-debug-apk
          path: smartboard/android/app/build/outputs/apk/debug/app-debug.apk
