<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartBoard Viewer</title>
  <link rel="stylesheet" href="/static/styles.css?v=5" />
</head>
<body>
  <aside>
    <h1>SmartBoard</h1>
    <label>Sesión <input id="session" value="demo" /></label>
    <button id="connect">Conectar</button>
    <button id="refresh">Actualizar</button>
    <button id="clear">Borrar</button>
    <button id="ask">Consultar IA</button>
    <button id="exportPng">Exportar PNG</button>
    <label class="fileLabel">PDF/Slides <input id="pdfFile" type="file" accept="application/pdf" /></label>
    <button id="prevPage">Página -</button>
    <button id="nextPage">Página +</button>
    <p id="pageInfo">Sin documento</p>
    <p id="status">Desconectado</p>
    <textarea id="context" placeholder="Contexto para Ollama"></textarea>
    <pre id="ai"></pre>
  </aside>
  <main>
    <canvas id="board"></canvas>
    <section id="simulationPanel" hidden>
      <div id="simulationToolbar"><button id="previousSimulation">Anterior</button><span id="simulationCounter"></span><button id="nextSimulation">Siguiente</button><button id="closeSimulation">Cerrar simulación</button></div>
      <iframe id="mechanismSimulation" title="Simulación del mecanismo"></iframe>
    </section>
  </main>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
